<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="Mystery Box UK logo">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6fa5" />
      <stop offset="100%" stop-color="#9b5de5" />
    </linearGradient>
  </defs>
  <rect x="4" y="14" width="52" height="52" rx="14" fill="url(#logo-grad)" />
  <g transform="translate(30,40)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-15" y="-4" width="30" height="22" rx="4" />
    <rect x="-18" y="-14" width="36" height="10" rx="4" />
    <line x1="0" y1="-14" x2="0" y2="18" />
  </g>
  <text x="70" y="38" font-family="Baloo 2, Quicksand, sans-serif" font-weight="800" font-size="26" fill="#7a3dc2">Mystery Box</text>
  <text x="70" y="60" font-family="Nunito Sans, sans-serif" font-weight="600" font-size="15" letter-spacing="3" fill="#e14d82">UK</text>
